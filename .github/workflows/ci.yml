name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_USER: spk_r5
          POSTGRES_PASSWORD: spk_r5_ci
          POSTGRES_DB: spk_r5_parking_log
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spk_r5 -d spk_r5_parking_log"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # e2e derives spk_r5_parking_log_test from this and creates it.
      DATABASE_URL: postgresql://spk_r5:spk_r5_ci@localhost:5432/spk_r5_parking_log
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared types and generate Prisma client
        run: |
          pnpm --filter @spk-r5-parking-log/shared-types build
          pnpm --filter backend prisma:generate
      - run: pnpm lint
      - run: pnpm --filter frontend typecheck
      - name: Build apps
        run: pnpm --filter backend build && pnpm --filter frontend build
      - run: pnpm test
      - name: Backend e2e
        run: pnpm --filter backend test:e2e

  images:
    needs: check
    # Build on every push so a broken Dockerfile shows up before main;
    # only main pushes the result.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # The VPS is x86_64.
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the Dokploy webhook secrets. No reviewer: merging to main is the
    # approval.
    environment:
      name: production
      url: https://parking.spkr5.com
    env:
      SITE: https://parking.spkr5.com
      EXPECTED_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # needs-deploy.sh diffs against the commit production runs.
          fetch-depth: 0
      - name: Decide what to deploy
        id: plan
        run: |
          shared="packages/shared-types package.json pnpm-lock.yaml pnpm-workspace.yaml .dockerignore"
          backend=$(deploy/ci/needs-deploy.sh "$(deploy/ci/deployed-version.sh backend "$SITE/api/health")" apps/backend $shared)
          frontend=$(deploy/ci/needs-deploy.sh "$(deploy/ci/deployed-version.sh frontend "$SITE/version.txt")" apps/frontend $shared)
          echo "backend=$backend frontend=$frontend"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
      # Backend first so the new frontend never calls an old API.
      - name: Deploy backend
        if: steps.plan.outputs.backend == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_BACKEND_WEBHOOK }}
        run: deploy/ci/dokploy-deploy.sh backend "$SITE/api/health"
      - name: Deploy frontend
        if: steps.plan.outputs.frontend == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_FRONTEND_WEBHOOK }}
        run: deploy/ci/dokploy-deploy.sh frontend "$SITE/version.txt"
