# Static SPA server for the frontend image. Traefik (Dokploy) terminates TLS
# and routes /api to the backend, so this server only serves dist/.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Inherited by every location below as long as a location does not set
    # its own add_header. Cache rules therefore use `expires`, not add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Vite puts a content hash in every asset file name.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Unknown paths get index.html, which must never be cached so a new
    # deploy reaches users immediately.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
